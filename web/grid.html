<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coverage grid</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#17211f;--muted:#65716d;--paper:#f4f1e9;--panel:#fffdf8;--mint:#b4e1d2;--orange:#ef8c55;--line:#d8d8ca}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif}main{max-width:1500px;margin:auto;padding:28px;display:grid;gap:20px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}h1{font-size:clamp(28px,4vw,48px);line-height:1;margin:0 0 8px}.kicker,.label{font:500 11px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:1.5px;color:#52766d}p{color:var(--muted);margin:0;line-height:1.45}a{color:#23685b;font-weight:600;text-decoration:none}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);padding:18px}.grid-wrap{overflow:auto}.grid{display:grid;gap:2px;background:#ccd8d1;padding:2px;grid-template-columns:repeat(var(--columns),var(--cell-size));grid-auto-rows:var(--cell-size);--cell-size:clamp(18px,3vw,34px)}.cell{width:var(--cell-size);height:var(--cell-size);border:0;padding:0;background:#eef2ec;color:var(--ink);font:500 clamp(8px,1.3vw,14px) 'DM Mono',monospace;display:grid;place-items:center;cursor:pointer}.cell.covered{background:var(--mint)}.cell.multi{background:#75b9a2;color:#fffdf8}.cell.deep{background:#387d70;color:#fffdf8}.cell.selected{outline:3px solid var(--orange);outline-offset:-3px}.legend{display:grid;gap:12px}.legend-row{display:flex;align-items:center;gap:9px;font-size:13px}.swatch{width:24px;height:24px;background:#eef2ec;border:1px solid var(--line)}.swatch.covered{background:var(--mint)}.swatch.multi{background:#75b9a2}.swatch.deep{background:#387d70}.stats{border-top:1px solid var(--line);padding-top:16px;margin-top:18px;display:grid;gap:10px}.stat{display:flex;justify-content:space-between;gap:12px;font-size:13px}.stat strong{font-family:'DM Mono',monospace}.areas{display:grid;gap:7px;margin-top:18px}.area{font-size:12px;padding:8px 0;border-top:1px solid var(--line)}.area small{display:block;color:var(--muted);margin-top:3px;font-family:'DM Mono',monospace}.cell-detail{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.cell-meta{display:grid;gap:7px;margin:12px 0;font-size:13px}.cell-meta strong{font-family:'DM Mono',monospace}.tile-list{display:grid;gap:8px;max-height:360px;overflow:auto;margin-top:10px}.tile-card{border-top:1px solid var(--line);padding-top:8px;font-size:12px}.tile-card code{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#23685b}.tile-card small{display:block;color:var(--muted);line-height:1.45;margin-top:3px}.empty{padding:60px;text-align:center;background:var(--panel);color:var(--muted)}
    @media(max-width:850px){main{padding:18px}.layout{grid-template-columns:1fr}.panel{padding:12px}header{display:block}header a{display:inline-block;margin-top:14px}}
    .viewer-modal,.fetch-modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(23,33,31,.65)}.viewer-modal[hidden],.fetch-modal[hidden]{display:none}.viewer-dialog,.fetch-dialog{width:min(1100px,100%);height:min(820px,calc(100vh - 48px));background:var(--panel);display:grid;grid-template-rows:auto 1fr;box-shadow:0 24px 70px rgba(23,33,31,.35)}.fetch-dialog{width:min(680px,100%);height:auto;max-height:calc(100vh - 48px)}.viewer-head,.fetch-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.viewer-head h2,.fetch-head h2{margin:0;font-size:18px}.viewer-close,.fetch-close{margin:0;padding:5px 10px;background:transparent;color:var(--ink);font-size:24px;border:0;cursor:pointer}.viewer-dialog model-viewer{width:100%;height:100%;background:#171b1b}.fetch-body{padding:18px;overflow:auto}.fetch-status{font-weight:600}.fetch-stats{display:grid;gap:8px;margin:16px 0;font:13px 'DM Mono',monospace}.fetch-log{background:#17211f;color:#b4e1d2;padding:12px;min-height:120px;white-space:pre-wrap;font:12px 'DM Mono',monospace}.tile-card button,.merge-button,.fetch-button{border:0;background:var(--ink);color:var(--panel);padding:7px 10px;font:600 12px 'Space Grotesk';cursor:pointer}.merge-button,.fetch-button{width:100%;margin-top:14px}.merge-button{background:var(--orange);color:var(--ink)}.fetch-button{background:#75b9a2}button:disabled{opacity:.45;cursor:wait}.orientation{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font:500 11px 'DM Mono',monospace;text-transform:uppercase}.orientation .north{text-align:center;color:var(--ink)}.orientation .west{text-align:left}.orientation .east{text-align:right}.mode-switch{display:flex;gap:6px;margin-top:16px}.mode-switch button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 11px;font:600 12px 'Space Grotesk';cursor:pointer}.mode-switch button.active{background:var(--ink);color:var(--panel)}.mode-note{margin-top:10px;font-size:12px}
  </style>
</head>
<body>
  <main>
    <header><div><div class="kicker">Tile fieldwork / coverage index</div><h1>Coverage grid</h1><p>Compare geographic area coverage with approximate tile placement. Rows run north/south; columns run west/east.</p><div class="mode-switch"><button type="button" data-mode="area" class="active">Area / lat-lon</button><button type="button" data-mode="tiles">Tile orientation</button></div><div class="mode-note" id="modeNote">Area mode counts each covered area's manifest.</div></div><a href="/">Back to map</a></header>
    <div id="content" class="empty">Reading cached tile coverage...</div>
  </main>
  <div class="viewer-modal" id="viewerModal" hidden><section class="viewer-dialog" role="dialog" aria-modal="true" aria-labelledby="viewerTitle"><header class="viewer-head"><h2 id="viewerTitle">Tile viewer</h2><button class="viewer-close" id="viewerClose" type="button" aria-label="Close viewer">×</button></header><model-viewer id="viewerModel" camera-controls auto-rotate shadow-intensity="0.8" exposure="1.1"></model-viewer></section></div>
  <div class="fetch-modal" id="fetchModal" hidden><section class="fetch-dialog" role="dialog" aria-modal="true" aria-labelledby="fetchTitle"><header class="fetch-head"><h2 id="fetchTitle">Fetch selected cell</h2><button class="fetch-close" id="fetchClose" type="button" aria-label="Close fetch status">×</button></header><div class="fetch-body"><div class="fetch-status" id="fetchStatus">Starting...</div><div class="fetch-stats" id="fetchStats"></div><pre class="fetch-log" id="fetchLog"></pre></div></section></div>
  <script>
    let content=document.getElementById('content');
    let activeMode='area';
    const modeNote=document.getElementById('modeNote');
    document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>loadGrid(button.dataset.mode));
    function loadGrid(mode){activeMode=mode;document.querySelectorAll('[data-mode]').forEach(button=>button.classList.toggle('active',button.dataset.mode===mode));modeNote.textContent=mode==='tiles'?'Tile mode uses approximate transformed GLB footprints; a tile can appear in multiple cells.':'Area mode counts each covered area\'s manifest.';content.textContent='Reading coverage...';fetch(`/api/grid?mode=${mode}`).then(response=>response.json()).then(render).catch(()=>{content.textContent='Could not load coverage data.'})}
    const viewerModal=document.getElementById('viewerModal'),viewerModel=document.getElementById('viewerModel'),viewerTitle=document.getElementById('viewerTitle');
    function openViewer(url,title){viewerTitle.textContent=title;viewerModel.src=url;viewerModal.hidden=false}
    function closeViewer(){viewerModal.hidden=true;viewerModel.removeAttribute('src')}
    document.getElementById('viewerClose').onclick=closeViewer;viewerModal.onclick=event=>{if(event.target===viewerModal)closeViewer()};
    const fetchModal=document.getElementById('fetchModal'),fetchStatus=document.getElementById('fetchStatus'),fetchStats=document.getElementById('fetchStats'),fetchLog=document.getElementById('fetchLog');
    document.getElementById('fetchClose').onclick=()=>fetchModal.hidden=true;
    function showFetchStatus(status){fetchStatus.textContent=status.message||status.status;const elevation=Number.isFinite(Number(status.center_elevation_m))?`${Number(status.center_elevation_m).toFixed(1)} m`:'not available yet';fetchStats.innerHTML=`Centroid <strong>${Number(status.latitude).toFixed(6)}, ${Number(status.longitude).toFixed(6)}</strong><br>Cell size <strong>${status.size_m||'?'} m</strong><br>Center elevation used <strong>${elevation}</strong><br>Command <code>${status.command||'not available yet'}</code><br>Progress <strong>${status.completed||0} / ${status.total||'?'}</strong><br>Raw hits <strong>${status.raw_hits||0}</strong><br>Unique tiles <strong>${status.unique_tiles||0}</strong><br>Hit offsets <strong>${status.hit_offsets?.length?status.hit_offsets.map(value=>`+${value} m`).join(', '):'none yet'}</strong><br>Errors <strong>${status.errors||0}</strong>${status.elapsed_seconds?`<br>Elapsed <strong>${status.elapsed_seconds}s</strong>`:''}`;fetchLog.textContent=status.status==='complete'?`Completed. Areas updated: ${(status.areas||[]).join(', ')||'none'}\nNew/returned tile hashes: ${(status.tile_hashes||[]).length}`:`Sampling selected cell...\nOffsets with hits: ${(status.hit_offsets||[]).join(', ')||'none yet'}`}
    async function pollFetchStatus(id){try{const response=await fetch(`/api/fetch-cell-status?id=${id}`),status=await response.json();showFetchStatus(status);if(status.status==='running'){setTimeout(()=>pollFetchStatus(id),1000)}else if(status.status==='complete'){setTimeout(()=>loadGrid('tiles'),500)}}catch(error){fetchStatus.textContent=`Status unavailable: ${error.message}`}}
    async function startSparseBatch(maximumTiles){fetchModal.hidden=false;fetchStatus.textContent='Starting sparse-cell batch...';fetchStats.innerHTML=`Cells with <strong>1 to ${maximumTiles} tiles</strong>`;fetchLog.textContent='Building tile-orientation coverage list...';try{const response=await fetch('/api/fetch-cell-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({maximum_tiles:maximumTiles})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Batch fetch failed');pollSparseBatch(result.id)}catch(error){fetchStatus.textContent=error.message;fetchLog.textContent='Batch could not start.'}}
    async function pollSparseBatch(id){try{const response=await fetch(`/api/fetch-cell-batch-status?id=${id}`),status=await response.json();fetchStatus.textContent=status.message||status.status;fetchStats.innerHTML=`Cells <strong>${status.current||0} / ${status.total||0}</strong><br>Completed <strong>${status.completed||0}</strong><br>Failed <strong>${status.failed||0}</strong><br>Traversal errors <strong>${status.errors||0}</strong><br>Returned tile hashes <strong>${status.tile_hashes||0}</strong>`;fetchLog.textContent=(status.events||[]).join('\n')||'Waiting for the first cell to start...';if(status.status==='running'){setTimeout(()=>pollSparseBatch(id),1000)}else if(status.status==='complete'){setTimeout(()=>{fetchLog.textContent+=(status.events?.length?'\n':'')+'Batch complete. Refreshing tile orientation...';fetchModal.hidden=true;loadGrid('tiles')},700)}}catch(error){fetchStatus.textContent=`Status unavailable: ${error.message}`;fetchLog.textContent='Could not read batch status.'}}
    async function startCellFetch(cell){fetchModal.hidden=false;showFetchStatus({status:'running',message:'Starting cell fetch...',latitude:cell.centroid.latitude,longitude:cell.centroid.longitude,size_m:cell.size_m,completed:0,total:0,raw_hits:0,unique_tiles:0,hit_offsets:[],errors:0});try{const response=await fetch('/api/fetch-cell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({latitude:cell.centroid.latitude,longitude:cell.centroid.longitude,size_m:cell.size_m})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Cell fetch failed');pollFetchStatus(result.id)}catch(error){showFetchStatus({status:'error',message:error.message,latitude:cell.centroid.latitude,longitude:cell.centroid.longitude,size_m:cell.size_m,errors:1})}}
    function showCell(cell,panel,mode){
      const formatHeight=value=>value===null?'n/a':`${Number(value).toFixed(2)} m`;
      panel.innerHTML=`<div class="label">Selected cell</div><div class="cell-meta"><div>Centroid <strong>${cell.centroid.latitude.toFixed(6)}, ${cell.centroid.longitude.toFixed(6)}</strong></div><div>Cell size <strong>${cell.size_m} m x ${cell.size_m} m</strong></div><div>Covered areas <strong>${cell.areas}</strong></div><div>Cached tiles <strong>${cell.tiles}</strong></div></div>${mode==='tiles'?'<button class="fetch-button" type="button">Fetch again</button>':''}<div class="label" style="margin-top:18px">Tile details</div><div class="tile-list">${cell.tile_details.length?cell.tile_details.map(tile=>`<div class="tile-card"><code>${tile.hash}</code><small>${(tile.bytes/1024).toFixed(1)} KB · ${tile.nodes} nodes · ${tile.meshes} meshes<br>Geometry height ${formatHeight(tile.height)} (${formatHeight(tile.min_z)} to ${formatHeight(tile.max_z)})</small><button type="button" data-tile-hash="${tile.hash}">View tile</button></div>`).join(''):'<p>No cached tiles in this cell.</p>'}</div><button class="merge-button" type="button" ${cell.tile_details.length?'':'disabled'}>Merge cell tiles and view</button>`;
      panel.querySelector('.fetch-button')?.addEventListener('click',()=>startCellFetch(cell));
      panel.querySelectorAll('[data-tile-hash]').forEach(button=>{const tile=cell.tile_details.find(item=>item.hash===button.dataset.tileHash);button.onclick=()=>openViewer(`/cache/${tile.hash}.glb`,`Tile ${tile.hash.slice(0,12)}`)});
      panel.querySelector('.merge-button').onclick=async event=>{const button=event.currentTarget;button.disabled=true;button.textContent='Merging…';try{const response=await fetch('/api/merge-cell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tile_hashes:cell.tile_details.map(tile=>tile.hash)})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Cell merge failed');openViewer(result.model_url,`Merged cell · ${result.tile_count} tiles`)}catch(error){button.textContent=error.message}finally{button.disabled=false;if(button.textContent==='Merging…')button.textContent='Merge cell tiles and view'}};
    }
    function render(data){
      if(!data.rows){content.textContent='No downloaded areas yet.';return}
      const cells=new Map(data.cells.map(cell=>[`${cell.row}:${cell.column}`,cell]));
      const covered=data.cells.filter(cell=>cell.areas>0).length;
      const stacked=data.cells.filter(cell=>cell.tiles>1).length;
      const grid=document.createElement('div');grid.className='grid';grid.style.setProperty('--columns',data.columns);
      const detailPanel=document.createElement('div');detailPanel.className='cell-detail';detailPanel.innerHTML='<div class="label">Selected cell</div><p>Click a cell to inspect its centroid and cached tiles.</p>';
      for(let row=data.rows-1;row>=0;row--){for(let column=0;column<data.columns;column++){
        const cell=cells.get(`${row}:${column}`),button=document.createElement('button');button.className='cell';
        if(cell.areas)button.classList.add('covered');if(cell.tiles>1)button.classList.add('multi');if(cell.tiles>3)button.classList.add('deep');
        button.textContent=cell.tiles||'';button.title=`${cell.tiles} cached tile${cell.tiles===1?'':'s'} · ${cell.areas} covered area${cell.areas===1?'':'s'}`;button.setAttribute('aria-label',button.title);button.onclick=()=>{document.querySelectorAll('.cell.selected').forEach(selected=>selected.classList.remove('selected'));button.classList.add('selected');showCell(cell,detailPanel,data.mode)};grid.appendChild(button);
      }}
      const orientation=document.createElement('div');orientation.className='orientation';orientation.innerHTML='<span class="west">W ← longitude</span><strong class="north">N ↑ latitude ↓ S</strong><span class="east">longitude → E</span>';
      const layout=document.createElement('div');layout.className='layout';const gridPanel=document.createElement('section');gridPanel.className='panel grid-wrap';gridPanel.append(grid,orientation,detailPanel);const side=document.createElement('aside');side.className='panel';side.innerHTML=`<div class="label">Legend</div><div class="legend"><div class="legend-row"><i class="swatch"></i> No downloaded area</div><div class="legend-row"><i class="swatch covered"></i> ${data.mode==='tiles'?'Tile footprint':'Area'} coverage</div><div class="legend-row"><i class="swatch multi"></i> 2+ ${data.mode==='tiles'?'tiles':'stacked tiles'}</div><div class="legend-row"><i class="swatch deep"></i> 4+ ${data.mode==='tiles'?'tiles':'stacked tiles'}</div></div><div class="stats"><div class="stat"><span>Cell size</span><strong>${data.cell_size} m</strong></div><div class="stat"><span>Covered cells</span><strong>${covered}</strong></div><div class="stat"><span>${data.mode==='tiles'?'Tile':'Stacked'} cells</span><strong>${stacked}</strong></div>${data.mode==='tiles'?`<div class="stat"><span>Unplaced tiles</span><strong>${data.unplaced_tiles}</strong></div>`:''}</div><div class="areas"><div class="label">Areas</div>${data.areas.map(area=>`<div class="area"><a href="/area?area=${encodeURIComponent(area.id)}">${area.name}</a><small>${area.tile_count} cached tiles · ${area.radius_meters} m radius</small></div>`).join('')}</div>`;if(data.mode==='tiles'){side.insertAdjacentHTML('beforeend',`<div class="batch-tools"><div class="label">Sparse cell retry</div><label for="sparseLimit">Refetch cells with <strong>1 to <output id="sparseLimitValue">1</output> tiles</strong></label><input id="sparseLimit" type="range" min="1" max="4" step="1" value="1"><button class="fetch-button" id="sparseFetch" type="button">Fetch sparse cells</button></div>`);const limit=side.querySelector('#sparseLimit'),value=side.querySelector('#sparseLimitValue');limit.oninput=()=>value.textContent=limit.value;side.querySelector('#sparseFetch').onclick=()=>startSparseBatch(Number(limit.value))}layout.append(gridPanel,side);content.replaceWith(layout);content=layout
    }
    loadGrid('area');
  </script>
</body>
</html>
